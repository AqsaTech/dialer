<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="auth-card px-3">
    <h1 class="h3 mb-4">Choose a new password</h1>
    <form id="resetForm" class="card card-body shadow-sm">
      <label class="form-label" for="newPassword">New password</label>
      <input id="newPassword" type="password" class="form-control mb-2" autocomplete="new-password" minlength="10" required>
      <p class="form-text">At least 10 characters, with letters and digits.</p>
      <button class="btn btn-primary">Save password</button>
    </form>
    <div id="noToken" class="alert alert-warning d-none">This reset link is incomplete. Request a new one from the sign-in page.</div>
    <div id="done" class="alert alert-success d-none">Password saved. <a href="/">Sign in</a></div>
  </main>
  <script type="module" src="/static/js/reset.js"></script>
</body>
</html>
