<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand">Dialer</span>
      <div class="d-flex align-items-center gap-3">
        <span class="small text-muted"><span id="liveDot" class="status-dot off"></span><span id="liveText">Connecting</span></span>
        <span id="who" class="small"></span>
        <a id="adminLink" href="/panel" class="btn btn-sm btn-outline-secondary d-none">Admin</a>
        <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <label class="form-label" for="numberSelect">Call and text from</label>
            <select id="numberSelect" class="form-select mb-3"></select>
            <input id="display" class="form-control display mb-3" placeholder="+923001234567" inputmode="tel" autocomplete="off" aria-label="Number to dial">
            <div class="keypad mb-3">
              <button class="btn btn-light border key" data-digit="1">1</button>
              <button class="btn btn-light border key" data-digit="2">2</button>
              <button class="btn btn-light border key" data-digit="3">3</button>
              <button class="btn btn-light border key" data-digit="4">4</button>
              <button class="btn btn-light border key" data-digit="5">5</button>
              <button class="btn btn-light border key" data-digit="6">6</button>
              <button class="btn btn-light border key" data-digit="7">7</button>
              <button class="btn btn-light border key" data-digit="8">8</button>
              <button class="btn btn-light border key" data-digit="9">9</button>
              <button class="btn btn-light border key" data-digit="+">+</button>
              <button class="btn btn-light border key" data-digit="0">0</button>
              <button id="backspace" class="btn btn-light border key" aria-label="Delete last digit">&#9003;</button>
            </div>
            <button id="dialBtn" class="btn btn-success w-100">Call</button>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h6">Send a text</h2>
            <textarea id="smsBody" class="form-control mb-2" rows="3" maxlength="1000" placeholder="Message" aria-label="Message"></textarea>
            <button id="smsBtn" class="btn btn-primary w-100">Send text to the number above</button>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div id="activeCall" class="alert alert-success d-none d-flex justify-content-between align-items-center">
          <div><strong id="activeWho"></strong> <span id="activeStatus" class="badge text-bg-success ms-2"></span></div>
          <button id="hangupBtn" class="btn btn-danger btn-sm">Hang up</button>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white d-flex flex-wrap gap-2 align-items-center">
            <h2 class="h6 mb-0 me-auto">History</h2>
            <select id="fType" class="form-select form-select-sm w-auto" aria-label="Type">
              <option value="">Calls and texts</option><option value="call">Calls</option><option value="sms">Texts</option>
            </select>
            <select id="fDirection" class="form-select form-select-sm w-auto" aria-label="Direction">
              <option value="">In and out</option><option value="inbound">Incoming</option><option value="outbound">Outgoing</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="table table-sm align-middle mb-0">
              <thead class="table-light"><tr><th>When</th><th>Type</th><th>Number</th><th>Status</th><th>Details</th></tr></thead>
              <tbody id="logRows"></tbody>
            </table>
          </div>
          <div class="card-footer bg-white text-center">
            <p id="emptyLogs" class="text-muted my-2 d-none">No calls or texts yet.</p>
            <button id="moreBtn" class="btn btn-sm btn-outline-secondary d-none">Load older</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="incomingModal" tabindex="-1" data-bs-backdrop="static" aria-labelledby="incomingTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content text-center">
        <div class="modal-body py-4">
          <div class="display-6 ring mb-2" aria-hidden="true">&#128222;</div>
          <h2 class="h5" id="incomingTitle">Incoming call</h2>
          <p class="fs-5 mb-1" id="callerNumber"></p>
          <p class="text-muted small" id="callerLine"></p>
          <div class="d-flex gap-2 justify-content-center">
            <button id="rejectBtn" class="btn btn-danger">Reject</button>
            <button id="answerBtn" class="btn btn-success">Answer</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/static/js/dashboard.js"></script>
</body>
</html>
