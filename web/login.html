<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
  <main class="auth-card px-3">
    <h1 class="h3 mb-4">Sign in</h1>
    <form id="loginForm" class="card card-body shadow-sm">
      <label class="form-label" for="username">Username or email</label>
      <input id="username" class="form-control mb-3" autocomplete="username" required>
      <label class="form-label" for="password">Password</label>
      <input id="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
      <button class="btn btn-primary">Sign in</button>
    </form>
    <p class="mt-3"><a href="#" id="toggleForgot">Forgot your password?</a></p>
    <div id="forgotBox" class="d-none">
      <form id="forgotForm" class="card card-body">
        <label class="form-label" for="forgotEmail">Your email</label>
        <input id="forgotEmail" type="email" class="form-control mb-3" required>
        <button class="btn btn-outline-secondary">Send reset link</button>
      </form>
    </div>
  </main>
  <script type="module" src="/static/js/login.js"></script>
</body>
</html>
